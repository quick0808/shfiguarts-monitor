name: S.H.Figuarts Monitor

on:
  schedule:
    - cron: '0 * * * *'       # 每小时第0分钟运行（UTC时间）
  workflow_dispatch:           # 允许手动触发测试

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests beautifulsoup4

      - name: 运行监控脚本
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
        run: python monitor_shf.py

      - name: 提交 found_items.json（保持记忆）
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add found_items.json
          git diff --staged --quiet || (git commit -m "Update found items [skip ci]" && git push)
